[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odrive-actuator-bench"
version = "0.3.0"
description = "Bench-test an actuator on an ODrive V3.6 or a SimpleFOC board: live torque, stall/hold tests, weight calibration, and the friction, inertia, speed, backlash and thermal values a robot simulation needs. Windows and macOS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Teh Bing Quan" }]
dependencies = [
    # PySide6 6.12.0 on Linux corrupts reference counts unless Python is 3.12+ (see requirements.txt).
    "PySide6-Essentials>=6.5,<6.12; sys_platform == 'linux' and python_version < '3.12'",
    "PySide6-Essentials>=6.5; sys_platform != 'linux' or python_version >= '3.12'",
    "pyqtgraph>=0.13.3",
    "numpy>=1.23",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Official ODrive library: an optional second way to talk to the board.
native = ["odrive>=0.6.1"]
dev = ["pytest>=7"]

[project.scripts]
odrive-actuator-bench = "actuator_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["actuator_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
